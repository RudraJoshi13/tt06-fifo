# Tiny Tapeout project information
project:
  title:        "8x16 Synchronous FIFO"
  author:       "Rudra Joshi"
  discord:      ""
  description:  "8-bit wide, 16-deep synchronous FIFO with full and empty flags"
  language:     "Verilog"
  clock_hz:     50000000

  # Starting at 1x1. The FIFO itself is only about 450 cells; see docs/info.md.
  # If the build fails on utilisation or routing, step up to the next tile size.
  tiles: "1x1"

  top_module:  "tt_um_rj_fifo"

  source_files:
    - "project.v"

# Pinout. Leave a pin blank if it is unused.
pinout:
  ui[0]: "wr_data[0]"
  ui[1]: "wr_data[1]"
  ui[2]: "wr_data[2]"
  ui[3]: "wr_data[3]"
  ui[4]: "wr_data[4]"
  ui[5]: "wr_data[5]"
  ui[6]: "wr_data[6]"
  ui[7]: "wr_data[7]"

  uo[0]: "rd_data[0]"
  uo[1]: "rd_data[1]"
  uo[2]: "rd_data[2]"
  uo[3]: "rd_data[3]"
  uo[4]: "rd_data[4]"
  uo[5]: "rd_data[5]"
  uo[6]: "rd_data[6]"
  uo[7]: "rd_data[7]"

  uio[0]: "wr_en (in)"
  uio[1]: "rd_en (in)"
  uio[2]: "full (out)"
  uio[3]: "empty (out)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change
yaml_version: 6
